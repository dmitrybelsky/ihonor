name: ihonor
options:
  bundleIdPrefix: com.ihonor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  ihonor:
    type: application
    platform: macOS
    sources:
      - path: ihonor
    info:
      path: ihonor/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: ihonor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ihonor.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES  # @testable только в Debug, не течёт в Release
    # NB: для notarization/hardened-runtime pyengine надо собирать ДО подписи (или
    # переподписывать .app после). Сейчас ad-hoc/unsigned — postBuild годится.
    postBuildScripts:
      - name: Bundle Python engine
        # basedOnDependencyAnalysis:false → фаза идёт всегда, но скрипт сам фаст-путит
        # (без сети при наличии pyengine), поэтому инкрементальная сборка дешёвая.
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/pyengine/bin/python3"
        inputFiles:
          - "$(SRCROOT)/build_pyengine.sh"
          - "$(SRCROOT)/../pyproject.toml"
        script: '"${SRCROOT}/build_pyengine.sh" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/pyengine"'
  ihonorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ihonorTests
    dependencies:
      - target: ihonor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ihonor.tests
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  ihonor:
    build:
      targets:
        ihonor: all
        ihonorTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - ihonorTests
